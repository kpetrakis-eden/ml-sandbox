defaults:
  - base_config
  - scheduler: null
  - _self_

experiment:
  name: hpo.convnexttiny.balanced.aug # "BLUEBERRIES-MERGED-PINK-PURPLE"
  run_name: "convnexttiny-balanced-bicubic-aug"
  tracking_uri: "experiments/mlflow.db"
  artifact_location: "experiments"

seed: 123456789
epochs: 10
data:
  root: "data/processed/classification-merged-pink-purple"
  num_workers: 12
  batch_size : 250
  sampling: "balanced"
  preprocessing:
    padding_mode: null # "edge" # the mode for PadToSquare, null for no padding
    interpolation: "bicubic"
    img_size: 64
  normalization:
    mean: [0.4291, 0.5388, 0.3654]
    std: [0.1871, 0.2131, 0.1977] # [0.1859, 0.2121, 0.1966]
  augmentation:
    - _target_: torchvision.transforms.v2.RandomHorizontalFlip
      p: 0.5
    - _target_: torchvision.transforms.v2.RandomVerticalFlip
      p: 0.5
    - _target_: torchvision.transforms.v2.RandomRotation
      degrees: 10
    - _target_: torchvision.transforms.v2.ColorJitter
      brightness: 0.1 # 0.5
      # contrast: 0.05
      # saturation: 0.01
    # - _target_: torchvision.transforms.v2.RandomAdjustSharpness
    #   p: 0.5
    #   sharpness_factor: 2 
    # - _target_: torchvision.transforms.v2.GaussianBlur
    #   kernel_size:
    #   sigma: 

model:
  name: "convnext-tiny"
  num_classes: 5
  pretrained: true
  default_resnet_downsize: true

loss:
  name: "cross-entropy"
  focal_gamma: null
  focal_reduction: null

optimizer:
  name: "adamw"
  lr: 1e-4
  weight_decay: 0
  betas:
  momentum:
  nesterov:

class_names:
  - bud
  - flower
  - green
  - pink-purple
  - blue
